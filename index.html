<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свойства действий</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: тетрадь в клетку. Слева оглавление-закладки, справа лист с красным полем; на экране один раздел, внизу кнопка «Дальше». */
:root{
  --paper:#fbfcf7; --grid:rgba(110,150,200,.20); --sheet:#ffffff; --text:#1f2430; --muted:#5b6474;
  --ink:#1f3f99; --ink-soft:#e8eefb; --red:#c4302b; --red-soft:#fbeae8; --marker:#fff0a0;
  --ok:#2e7d3a; --ok-soft:#e4f2e5; --line:#d5dce7; --margin:#eba7a3; --scrim:rgba(20,28,45,.45);
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-math:"PT Serif","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161a21; --grid:rgba(120,160,210,.10); --sheet:#1e242d; --text:#e5e8ee; --muted:#9ba4b4;
  --ink:#a6bfff; --ink-soft:#26324a; --red:#ff8d84; --red-soft:#3b2524; --marker:rgba(255,224,90,.28);
  --ok:#88d595; --ok-soft:#1f3324; --line:#333c4a; --margin:#7a3f3c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161a21; --grid:rgba(120,160,210,.10); --sheet:#1e242d; --text:#e5e8ee; --muted:#9ba4b4;
  --ink:#a6bfff; --ink-soft:#26324a; --red:#ff8d84; --red-soft:#3b2524; --marker:rgba(255,224,90,.28);
  --ok:#88d595; --ok-soft:#1f3324; --line:#333c4a; --margin:#7a3f3c; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--paper); color:var(--text);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font:400 17px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-block:20px 60px}

/* шапка */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--margin);margin-bottom:22px}
.brand h1{font:700 clamp(2.2rem,6vw,3.2rem)/1 var(--f-hand);color:var(--ink)}
.brand p{margin:.35rem 0 0;color:var(--muted);font-size:.9rem}
.score{min-width:220px;font-size:.9rem;color:var(--muted)}
.score b{color:var(--text);font-size:1.05rem}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--ok);transition:width .4s}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}

/* оглавление */
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.toc .cur{display:none;font-weight:400;color:var(--muted)}
@media (max-width:860px){.toc{position:static}.toc .cur{display:inline}}
.toc details{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:6px}
.toc summary{font-weight:600;padding:6px 8px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.toc summary::after{content:"▾";color:var(--muted)}
.toc details[open] summary::after{content:"▴"}
.toc ol{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px;counter-reset:t}
.toc li button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 9px;display:flex;gap:8px;align-items:baseline;font-size:.93rem;line-height:1.3}
.toc li button:hover{background:var(--ink-soft)}
.toc li button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.toc li button .c{margin-left:auto;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.toc .grp{font:600 .72rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 9px 4px}

/* лист */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px 10px 10px 4px;padding:26px clamp(16px,4vw,40px) 30px clamp(26px,5vw,56px);position:relative;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:clamp(12px,2.6vw,30px);width:2px;background:var(--margin)}
.sheet>h2{font:700 clamp(1.9rem,5vw,2.5rem)/1.05 var(--f-hand);color:var(--ink);margin-bottom:6px}
.sheet .src{font-size:.85rem;color:var(--muted);margin:0 0 16px}
.lead{font-size:1.05rem;max-width:66ch;margin:0 0 18px}
.sheet p{max-width:70ch}
.stack{display:grid;gap:18px}
h3.sub{font:600 1.05rem/1.3 var(--f-body);margin:26px 0 10px}

/* правило */
.rule{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--sheet);display:grid;gap:10px;min-width:0}
.rule-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rule-top h3{font:600 1.08rem/1.3 var(--f-body)}
.num{font:700 1.3rem/1 var(--f-hand);color:var(--red);white-space:nowrap}
.badge{margin-left:auto;font-size:.75rem;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.badge.weak{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.verb{font-size:1.12rem;line-height:1.6;margin:0}
.verb::before{content:"«"}.verb::after{content:"»"}
.kw{background:linear-gradient(transparent 58%,var(--marker) 58%)}
.tw{background:var(--marker);border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.say{margin:0;color:var(--muted);font-size:.95rem}
.fxs{display:grid;gap:4px}
.fx{font:400 1.28rem/1.5 var(--f-math);color:var(--ink)}
.fx i{font-style:italic}
.fx .p{white-space:nowrap}
.fx.sm{font-size:1.08rem;color:var(--text)}
.fx.big{font-size:1.6rem}
.fx .chg{color:var(--red);font-weight:700}
.lbl{display:block;font:600 .72rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ex{border-top:1px dashed var(--line);padding-top:8px}
.story{margin:0;font-size:.97rem}
.note{font:500 1.42rem/1.2 var(--f-hand);color:var(--red);margin:0}
.trapnote{margin:0;padding:10px 12px;border-radius:6px;background:var(--red-soft);font-size:.95rem}
.trapnote b{color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.pair{grid-template-columns:minmax(0,1fr)}}
.side{font:600 .72rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.rect-svg{max-width:340px;width:100%;height:auto}
.rect-svg .a{fill:var(--ink-soft);stroke:var(--ink);stroke-width:1.5}
.rect-svg .b{fill:var(--marker);stroke:var(--ink);stroke-width:1.5}
.rect-svg text{fill:var(--text);font:italic 16px var(--f-math)}
.rect-svg text.s{font:13px var(--f-body);fill:var(--muted)}

/* кнопки */
.btn{background:var(--ink);color:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:.5em 1em;font-weight:600;font-size:.95rem}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.small{font-size:.85rem;padding:.35em .75em}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px dashed var(--line)}

/* план */
.plan{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:auto 76px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:6px;border:1px solid var(--line)}
.plan li.done{background:var(--ok-soft);border-color:transparent}
.plan li.done .pt{text-decoration:line-through;text-decoration-color:var(--ok)}
.plan input{width:20px;height:20px;accent-color:var(--ok)}
.plan .tm{font:700 1.25rem/1 var(--f-hand);color:var(--red)}
.plan .pt b{display:block}
.plan .pt span{font-size:.88rem;color:var(--muted)}
@media (max-width:560px){.plan li{grid-template-columns:auto minmax(0,1fr)}.plan .tm{grid-column:2}.plan .pt{grid-column:2}.plan li>button{grid-column:2;justify-self:start}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chip{display:flex;gap:8px;align-items:baseline;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:.88rem;line-height:1.3}
.chip:hover{border-color:var(--ink)}
.chip b{font:700 1.1rem/1 var(--f-hand);color:var(--muted);min-width:2.2em}
.chip.ok{background:var(--ok-soft);border-color:var(--ok)}
.chip.ok b{color:var(--ok)}
.chip.weak{background:var(--red-soft);border-color:var(--red)}
.chip.weak b{color:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.83rem;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.weak{background:var(--red-soft);border-color:var(--red)}

/* словарик близнецов */
.dict{border-collapse:collapse;width:100%;max-width:520px;font-size:.98rem}
.dict th,.dict td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.dict th{font:600 .72rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dict td:nth-child(2){color:var(--muted);width:30px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.seg button{border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:4px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* задания */
.task{display:grid;gap:12px;min-width:0}
.task-q{font-weight:600;margin:0;font-size:1.05rem}
.task-q small{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
.prompt{margin:0;padding:10px 14px;border-left:3px solid var(--ink);background:var(--ink-soft);border-radius:0 6px 6px 0;font-size:1.05rem}
.build{min-height:2.8em;border-bottom:2px dashed var(--line);padding:6px 2px;font-size:1.08rem;line-height:1.6}
.build.fx{font-size:1.35rem}
.build .ph{color:var(--muted);font:500 1.2rem var(--f-hand)}
.tiles{display:flex;flex-wrap:wrap;gap:7px}
.tile{background:var(--sheet);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:.32em .7em;font-size:1rem;min-width:2.4em}
.tile.m{font:400 1.25rem/1.2 var(--f-math);color:var(--ink)}
.tile:hover{border-color:var(--ink)}
.tile.bad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.9rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--red-soft);border-color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.gapw{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--red);text-align:center;color:var(--red)}
.hid{display:inline-block;border-bottom:2px solid var(--muted);color:transparent;border-radius:2px;cursor:pointer;user-select:none}
.hid.peek{color:var(--red)}
.answer{padding:12px 14px;border-radius:6px;background:var(--ok-soft);display:grid;gap:6px}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:6px;margin-top:4px}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--red-soft)}
.fb span{font:700 1.45rem/1.1 var(--f-hand)}
.fb.good span{color:var(--ok)}.fb.bad span{color:var(--red)}
.prog{display:grid;gap:4px;margin-bottom:14px}
.prog small{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);transition:width .3s}
input.num{font:600 1.2rem var(--f-body);width:8em;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--text)}
.steps{display:grid;gap:2px}
.panel{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--sheet)}
.end h3{font:700 1.9rem/1.1 var(--f-hand);color:var(--ink);margin-bottom:6px}
.paper-list{display:grid;gap:12px;padding-left:1.4em;margin:0}
.paper-list li{padding-left:4px}
.selfmark{display:flex;gap:6px;margin-top:6px}
.fishki{display:grid;gap:10px;padding-left:1.4em;margin:0}

/* окно «Учить наизусть» */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ov-box{background:var(--sheet);border-radius:10px;width:100%;max-width:760px;padding:18px clamp(16px,4vw,30px) 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);min-width:0}
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.ov-head b{font:700 1.7rem/1.1 var(--f-hand);color:var(--ink)}
.ov-step{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.dots{display:flex;gap:5px;margin:6px 0 14px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--ink)}
.ov-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.bigtext{font-size:1.25rem;line-height:1.7;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Свойства действий</h1>
      <p>По памятке «Устный счёт. Свойства арифметических действий» · 5 класс</p>
    </div>
    <div class="score" id="score"></div>
  </header>
  <div class="layout">
    <nav class="toc" aria-label="Разделы"><details id="tocBox" open><summary id="tocSum">Разделы</summary><ol id="tocList"></ol></details></nav>
    <main id="main"></main>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="ov-box" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="ov-head"><b id="ovTitle"></b><button class="btn ghost small" id="ovClose">Закрыть</button></div><div id="ovBody"></div></div></div>

<script>
/* ---------- правила: тексты дословно по памятке ---------- */
const R=[
{id:'p1',sec:'perest',n:'1–2',name:'Переместительное свойство',text:'От перестановки мест слагаемых (множителей) значение суммы (произведения) не меняется.',f:['a + b = b + a','a · b = b · a'],fl:['для сложения','для умножения'],q:'Сформулируй переместительное свойство.',ex:['7 + 5 = 5 + 7 = 12','4 · 25 = 25 · 4 = 100'],hook:'«Переместительное» — от слова «переместить»: числа меняются местами.',gaps:[['перестановки',['изменения','расстановки']],['меняется',['изменяется','увеличивается']]]},
{id:'p2',sec:'perest',n:'3–4',name:'Сочетательное свойство',text:'От изменения расстановки скобок значение суммы (произведения) не меняется.',f:['(a + b) + c = a + (b + c)','(a · b) · c = a · (b · c)'],fl:['для сложения','для умножения'],q:'Сформулируй сочетательное свойство.',ex:['(17 + 25) + 75 = 17 + (25 + 75) = 17 + 100 = 117'],hook:'Числа стоят на своих местах, двигаются только скобки.',gaps:[['изменения',['перестановки','вычисления']],['скобок',['слагаемых','чисел']]]},
{id:'p3',sec:'perest',n:'',name:'Совокупность переместительного и сочетательного свойств',text:'При вычислении суммы (произведения) нескольких чисел можно любым образом переставлять и группировать слагаемые (множители).',f:[],q:'Сформулируй совокупность переместительного и сочетательного свойств.',ex:['25 + 39 + 75 + 61 = (25 + 75) + (39 + 61) = 200','2 · 17 · 50 = (2 · 50) · 17 = 1700'],hook:'Ищи пары, которые дают круглое число: 25 и 75, 2 и 50, 4 и 25.',gaps:[['переставлять',['вычитать','делить']],['группировать',['умножать','складывать']]]},

{id:'r5',sec:'vych',n:'5',name:'Вычитание суммы из числа',text:'При вычитании суммы из числа можно вычесть из него одно слагаемое, а затем из результата другое.',f:['a − (b + c) = (a − b) − c = (a − c) − b'],q:'Как вычесть сумму из числа?',ex:['100 − (30 + 45) = (100 − 30) − 45 = 70 − 45 = 25'],story:'У тебя 100 ₽. Ручка стоит 30 ₽, тетрадь 45 ₽. Можно заплатить сразу 75 ₽, а можно сначала за ручку, потом за тетрадь. Останется одинаково.',hook:'Минус перед скобкой достаётся каждому слагаемому: вычитаем и одно, и другое.',gaps:[['суммы',['разности','произведения']],['слагаемое',['вычитаемое','уменьшаемое']]]},
{id:'r6',sec:'vych',n:'6',name:'Деление числа на произведение',text:'При делении числа на произведение можно разделить его на один множитель, а затем результат разделить на другой.',f:['a : (b · c) = (a : b) : c = (a : c) : b'],q:'Как разделить число на произведение?',ex:['240 : (2 · 3) = (240 : 2) : 3 = 120 : 3 = 40'],story:'24 конфеты делят на 6 детей: это 2 команды по 3 человека. Можно разделить конфеты пополам между командами, а потом в каждой команде на троих.',hook:'Близнец правила 5: вместо «вычесть» — «разделить», вместо «слагаемое» — «множитель».',gaps:[['произведение',['частное','сумму']],['множитель',['делитель','слагаемое']]]},
{id:'r7',sec:'vych',n:'7',name:'Вычитание разности из числа',text:'При вычитании разности из числа можно вычесть из него уменьшаемое, а затем к результату прибавить вычитаемое.',f:['a − (b − c) = (a − b) + c = (a + c) − b'],q:'Как вычесть разность из числа?',ex:['50 − (20 − 3) = (50 − 20) + 3 = 30 + 3 = 33'],story:'У тебя 50 конфет. Брат хотел забрать 20, но 3 оставил тебе. Значит, 20 ушли, а 3 вернулись.',hook:'Уменьшаемое — вычесть, вычитаемое — прибавить. Минус перед скобкой переворачивает знак внутри.',gaps:[['разности',['суммы','частного']],['уменьшаемое',['вычитаемое','слагаемое']],['прибавить',['вычесть','умножить']],['вычитаемое',['уменьшаемое','слагаемое']]]},
{id:'r8',sec:'vych',n:'8',name:'Деление числа на частное',text:'При делении числа на частное можно его разделить на делимое, а затем результат умножить на делитель.',f:['a : (b : c) = (a : b) · c = (a · c) : b'],q:'Как разделить число на частное?',ex:['120 : (12 : 2) = (120 : 12) · 2 = 10 · 2 = 20'],hook:'Близнец правила 7: на делимое — разделить, на делитель — умножить.',gaps:[['частное',['произведение','разность']],['делимое',['делитель','уменьшаемое']],['умножить',['разделить','прибавить']],['делитель',['делимое','множитель']]]},
{id:'r9',sec:'vych',n:'9',name:'Вычитание числа из суммы',text:'При вычитании из суммы числа можно вычесть его из одного слагаемого, а затем к результату прибавить другое.',f:['(a + b) − c = (a − c) + b = a + (b − c)'],q:'Как вычесть число из суммы?',ex:['(235 + 48) − 35 = (235 − 35) + 48 = 200 + 48 = 248'],story:'В двух пакетах 235 и 48 орехов. Белка утащила 35. Удобно считать, что она взяла их из большого пакета.',hook:'Вычитай из того слагаемого, из которого удобнее, а второе просто прибавь.',gaps:[['суммы',['разности','произведения']],['одного',['каждого','другого']],['прибавить',['вычесть','умножить']]]},
{id:'r10',sec:'vych',n:'10',name:'Деление произведения на число',text:'При делении произведения на число можно разделить на него один множитель, а затем результат умножить на другой.',f:['(a · b) : c = (a : c) · b = a · (b : c)'],q:'Как разделить произведение на число?',ex:['(25 · 36) : 9 = 25 · (36 : 9) = 25 · 4 = 100'],hook:'Близнец правила 9. Дели тот множитель, который делится нацело, а второй просто умножь.',gaps:[['произведения',['суммы','частного']],['множитель',['делитель','слагаемое']],['умножить',['разделить','прибавить']]]},

{id:'r12',sec:'raspr',n:'12',name:'Распределительное свойство умножения относительно вычитания',text:'Произведение числа и разности двух чисел равно разности произведений данного числа на уменьшаемое и вычитаемое.',f:['(a − b) · c = a · c − b · c','a · (b − c) = a · b − a · c'],fl:['скобка стоит первой','скобка стоит второй'],q:'Сформулируй распределительное свойство умножения относительно вычитания.',ex:['(10 − 1) · 8 = 10 · 8 − 1 · 8 = 80 − 8 = 72','46 · 29 − 26 · 29 = (46 − 26) · 29 = 20 · 29 = 580'],hook:'То же, что правило 11, только в скобке минус.',gaps:[['разности',['суммы','произведения']],['уменьшаемое',['слагаемое','делимое']],['произведений',['сумм','частных']]]},

function speedDrill(host,restart){const gens=[
 ()=>{const n=2*rnd(6,49);return{e:`${n} · 5`,a:n*5,hn:`${n} · 10 : 2 = ${n*10} : 2`};},
 ()=>{const n=4*rnd(3,24);return{e:`${n} · 25`,a:n*25,hn:`${n} · 100 : 4 = ${n*100} : 4`};},
 ()=>{const k=pick([3,5,7]);return{e:`${125*k} · 8`,a:1000*k,hn:`${k} · 125 · 8 = ${k} · 1000`};},
 ()=>{const k=pick([2,3,4,6]);return{e:`125 · ${8*k}`,a:1000*k,hn:`125 · 8 · ${k} = 1000 · ${k}`};},
 ()=>{const k=rnd(2,9);return{e:`37 · ${3*k}`,a:111*k,hn:`37 · 3 · ${k} = 111 · ${k}`};},
 ()=>pick([{e:'7 · 11 · 13',a:1001,hn:'Число Шахерезады'},{e:'1001 : 7',a:143,hn:'1001 = 7 · 11 · 13, остаётся 11 · 13 = 143'},{e:'1001 : 11',a:91,hn:'остаётся 7 · 13 = 91'},{e:'1001 : 13',a:77,hn:'остаётся 7 · 11 = 77'},{e:'143 · 7',a:1001,hn:'11 · 13 · 7 = 1001'}])];

 function show(){host.replaceChildren();if(i>=qs.length){const s=Math.round((Date.now()-t0)/1000);host.append(h('div',{class:'panel end'},h('h3',null,`${good} из ${qs.length}`),h('p',null,`Время: ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}. Попробуй побить свой результат.`),h('button',{class:'btn',onclick:restart},'Ещё 10 примеров')));return;}
  const q=qs[i];const id='sp-'+(++uid);const inp=h('input',{class:'num',id,type:'text',inputmode:'numeric',autocomplete:'off','aria-label':'Ответ'});const msg=h('div',{class:'muted'});let fin=false;
  const nx=h('button',{class:'btn',hidden:true,onclick:()=>{i++;show();}},i+1<qs.length?'Дальше':'Итоги');

  function check(){if(fin){if(!nx.hidden)nx.click();return;}const v=inp.value.replace(/\s/g,'');if(v==='')return;if(!t0)t0=Date.now();fin=true;const ok=Number(v)===q.a;if(ok)good++;msg.innerHTML=(ok?'<b style="color:var(--ok)">Верно.</b> ':'<b style="color:var(--red)">Ответ: '+q.a+'.</b> ')+'Фишка: '+fmChain(q.hn);chk.hidden=true;nx.hidden=false;nx.focus();}

  host.append(h('div',{class:'panel'},h('div',{class:'prog'},h('small',null,`Пример ${i+1} из ${qs.length}`)),h('div',{class:'row'},h('label',{for:id,class:'fx big',html:fmChain(q.e)+' ='}),inp,chk,nx),msg));}
